    <title>Emma English Studio</title>
    <script>
      // The app's screens live after "#" (e.g. /#/learn). A typed path like /learn is sent there.
      location.replace(location.origin + "/#" + (location.pathname.replace(/\/index\.html$/, "") || "/") + location.search);
    </script>
